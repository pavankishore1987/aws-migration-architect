<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Wireframes — Workflow Orchestrator</title>
<style>
:root{
  --ac:#4a5ac9; --ac-600:#4f5ec2; --ac-700:#3a479c; --ac-50:#eef0fb; --ac-100:#dbdff7; --ac-200:#bfc6f0;
  --bg:#f4f4f6; --surface:#fff; --raised:#fafafb; --side:#fff; --ink:#1d1f23; --ink-2:#5d6068; --ink-3:#8a8d96;
  --line:#e4e5ea; --line-2:#d2d4db;
  --ok:#4f8f63; --ok-bg:#e9f3ec; --warn:#b8892f; --warn-bg:#f9f0dd; --bad:#b04a44; --bad-bg:#f9e9e8;
  --off:#98989b; --off-bg:#f0f0f2;
  --r:8px; --r-sm:6px; --r-lg:12px;
  --sh:0 1px 2px rgba(20,22,30,.06); --sh-md:0 4px 14px rgba(20,22,30,.10); --sh-lg:0 12px 34px rgba(20,22,30,.18);
}
:root[data-accent="blue"]{--ac:#4a7ab5;--ac-600:#3f689c;--ac-700:#325480;--ac-50:#eaf1f8;--ac-100:#d7e6f2;--ac-200:#b4d0e6}
:root[data-accent="teal"]{--ac:#3f8f8f;--ac-600:#357a7a;--ac-700:#2a6161;--ac-50:#eaf4f4;--ac-100:#d8ebeb;--ac-200:#b3d8d8}
:root[data-accent="purple"]{--ac:#7f5fb5;--ac-600:#6d519c;--ac-700:#584180;--ac-50:#f2eef9;--ac-100:#e7e0f3;--ac-200:#d0c4e8}
:root[data-theme="dark"]{
  --bg:#191b21; --surface:#20232b; --raised:#262a33; --side:#171a20; --ink:#eceef2; --ink-2:#a4a9b5; --ink-3:#787e8c;
  --line:#2e323c; --line-2:#3c4250;
  --ac-50:#252a41; --ac-100:#2d3350; --ac-200:#3f4870;
  --ok:#7cb894; --ok-bg:#1e3227; --warn:#d3ac6b; --warn-bg:#332a1a; --bad:#cf8a85; --bad-bg:#33201f;
  --off:#9a9a9e; --off-bg:#282b33;
  --sh:0 1px 2px rgba(0,0,0,.45); --sh-md:0 4px 14px rgba(0,0,0,.5); --sh-lg:0 14px 38px rgba(0,0,0,.62);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;font-family:inherit}
svg{display:block}
/* banner */
#banner{background:var(--surface);border-bottom:1px solid var(--line);padding:9px 18px;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
#banner b{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--ac);background:var(--ac-50);border:1px solid var(--ac-200);padding:4px 9px;border-radius:999px}
#banner .sp{margin-left:auto;display:flex;align-items:center;gap:14px}
#banner select{background:var(--raised);color:var(--ink);border:1px solid var(--line-2);padding:5px 8px;font-size:12px;border-radius:var(--r-sm)}
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.livedot i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
/* app frame: full-height sidebar + content column */
#app{max-width:1340px;margin:18px auto 46px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-height:700px;display:flex;overflow:hidden;box-shadow:var(--sh-md)}
.side{width:214px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0 0 14px}
.sidebrand{display:flex;align-items:center;gap:10px;padding:20px 16px 18px;font-weight:600;font-size:15.5px;letter-spacing:-.015em}
.logo{width:27px;height:27px;border-radius:7px;background:var(--ac);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.nav{padding:0 9px;overflow:auto;flex:1}
.navg{font-weight:600;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:15px 9px 7px}
.navi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;font-size:13.5px;color:var(--ink-2);border-radius:var(--r);margin-bottom:2px}
.navi:hover{background:var(--raised);color:var(--ink)}
.navi.on{background:var(--ac-50);color:var(--ac);font-weight:600}
.navi svg{width:17px;height:17px;flex:none}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;position:relative;border-bottom:1px solid var(--line)}
.tenant{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--raised);border-radius:var(--r);padding:8px 12px;font-size:13px;font-weight:500}
.tenant:hover{border-color:var(--ac)}
.tenant.static{cursor:default;background:none;color:var(--ink-2)}
.tenant.static:hover{border-color:var(--line-2)}
.search{flex:1;max-width:440px;height:38px;border:1px solid var(--line-2);background:var(--raised);border-radius:var(--r);display:flex;align-items:center;gap:9px;padding:0 12px;color:var(--ink-3);font-size:13px}
.who{display:flex;align-items:center;gap:10px;border:0;background:none;padding:5px 7px;border-radius:var(--r);margin-left:auto}
.who:hover{background:var(--raised)}
.av{width:34px;height:34px;border-radius:var(--r-sm);background:var(--ac-50);border:1px solid var(--ac-200);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--ac)}
.whoname{text-align:left;line-height:1.3}
.whoname b{display:block;font-size:13px;font-weight:600}
.whoname span{font-size:11.5px;color:var(--ink-3)}
.main{flex:1;min-width:0;padding:24px 26px 34px;overflow:auto}
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb button{border:0;background:none;padding:0;color:var(--ac);font-size:12.5px}
.crumb button:hover{text-decoration:underline}
.head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.h1{font-weight:600;font-size:29px;line-height:1.15;letter-spacing:-.022em}
.sub{font-size:13.5px;color:var(--ink-3);margin-top:5px}
.acts{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink);padding:9px 14px;font-size:13px;font-weight:500;border-radius:var(--r)}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--ac-600)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.quiet{border-color:transparent;background:none;color:var(--ac)}
.btn.quiet:hover{background:var(--ac-50)}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--raised)}
.seg button{border:0;background:none;padding:8px 14px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--ac);color:#fff;font-weight:600}
.seg button:not(.on):hover{color:var(--ink)}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--raised);color:var(--ink-2);font-size:12.5px;padding:7px 13px;border-radius:var(--r);font-weight:500}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.chip:not(.on):hover{border-color:var(--ac)}
.sfield{position:relative;display:flex;align-items:center;min-width:290px}
.sfield .sicon{position:absolute;left:11px;color:var(--ink-3);pointer-events:none}
.sinput{width:100%;height:36px;border:1px solid var(--line-2);background:var(--raised);border-radius:var(--r);padding:0 12px 0 34px;font:inherit;font-size:12.5px;color:var(--ink)}
.sinput::placeholder{color:var(--ink-3)}
.sinput:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}
.sortwrap{display:flex;align-items:center;gap:8px;white-space:nowrap}
.sortlab{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sortsel{height:36px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink);border-radius:var(--r);padding:0 9px;font:inherit;font-size:12.5px}
.sortsel:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}
.vtag{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;font-weight:600;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:2px 8px;white-space:nowrap}
.newpill{display:block;width:100%;border:1px solid var(--ac);background:var(--ac-50);color:var(--ac);font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:var(--r);margin-bottom:12px}
.newpill:hover{background:var(--ac-100)}
.emptyrow{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.emptyrow b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.finput{height:38px;min-width:300px;flex:1;max-width:420px;border:1px solid var(--line-2);background:var(--raised);border-radius:var(--r);display:flex;align-items:center;padding:0 12px;color:var(--ink-3);font-size:13px}
/* metric cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.card{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 17px;background:var(--surface)}
.card .k{font-weight:600;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.card .v{font-weight:600;font-size:34px;font-variant-numeric:tabular-nums;margin-top:9px;letter-spacing:-.03em;line-height:1.05;border-radius:var(--r-sm);transition:background .7s}
.card .v.bump{background:var(--ac-50)}
.card .m{font-size:11.5px;color:var(--ink-3);margin-top:7px;display:flex;align-items:center;gap:6px}

.trend{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600}
.trend.up{color:var(--ok)}.trend.down{color:var(--bad)}.trend.flat{color:var(--ink-3)}
/* panels */
.pan{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-bottom:18px}
.panh{display:flex;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panh h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.015em}
.panh .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.panb{padding:16px 17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>*{min-width:0}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:11px 17px;border-bottom:1px solid var(--line);background:var(--raised)}
td{padding:13px 17px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--raised)}
tbody tr.new td{animation:slidein 1.1s ease-out}
td.bumpcell{animation:slidein 1.1s ease-out}
@keyframes slidein{0%{background:var(--ac-50)}100%{background:transparent}}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.right{text-align:right}
.scroller{max-height:340px;overflow:auto}
/* status */
.pillst{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap}
.pillst.done{background:var(--ok-bg);color:var(--ok)}
.pillst.run{background:var(--warn-bg);color:var(--warn)}
.pillst.fail{background:var(--bad-bg);color:var(--bad)}
.pillst.skip{background:var(--off-bg);color:var(--off)}
.pillst i{font-style:normal;font-weight:700;font-size:10px;font-family:ui-monospace,Consolas,monospace}
.pillst.run i{animation:pulse 1.4s ease-in-out infinite}
/* steps */
.steps{display:flex;flex-wrap:wrap;gap:9px;align-items:center;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--raised);padding:16px 17px;margin-bottom:18px}
.step{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;padding:7px 12px;border-radius:999px;color:var(--ink-2)}
.step i{font-style:normal;font-weight:700;font-size:10px;font-family:ui-monospace,Consolas,monospace}
.step.done{border-color:transparent;background:var(--ok-bg);color:var(--ok);font-weight:600}
.step.now{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);font-weight:600}
.step.fail{border-color:transparent;background:var(--bad-bg);color:var(--bad);font-weight:600}
.step.halt{border-color:transparent;background:var(--off-bg);color:var(--off);font-weight:600}
.step.skip{opacity:.5}
.sep{color:var(--line-2)}
/* canvas */
.cvwrap{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.cv{flex:1;min-width:320px;display:flex;flex-direction:column}
.cvbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--raised);flex-wrap:wrap}
.cvbar .lab{font-weight:600;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.cvbar .r{margin-left:auto;display:flex;align-items:center;gap:7px}
.cvbar .z{font-size:12px;color:var(--ink-3);min-width:38px;text-align:right}
.cvstage{flex:1;min-height:440px;max-height:560px;padding:22px;background-image:radial-gradient(var(--line) 1px, transparent 1px);background-size:18px 18px;overflow:auto}
.bn{position:absolute;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;width:216px;padding:10px 13px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);z-index:2}
.bn:hover{border-color:var(--ac)}
.bn-t{font-weight:600;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.bn-n{font-size:13px;font-weight:500;line-height:1.25}
.bn-s{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;margin-top:3px;padding:2px 7px;border-radius:999px}
.bn-s i{font-style:normal;font-family:ui-monospace,Consolas,monospace;font-size:9px}
.bn.ev{width:108px;align-items:center;border-radius:999px;padding:11px 13px}
.bn-ev{font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
/* diamond for a conditional */
.bn.ch{width:200px;height:120px;padding:0;border:0;background:none;box-shadow:none;align-items:center;justify-content:center}
.bn.ch .dm-edge,.bn.ch .dm-fill{position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.bn.ch .dm-edge{background:var(--line-2)}
.bn.ch .dm-fill{inset:2px;background:var(--surface)}
.bn.ch .dm-lab{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;max-width:118px;text-align:center}
.bn.ch .dm-n{font-size:11.5px;font-weight:500;line-height:1.2}
.bn.ch .dm-g{font-size:15px;font-weight:700;line-height:1;color:var(--ink-3)}
.bn.ch:hover .dm-edge{background:var(--ac)}
.bn.ch.done .dm-edge{background:var(--ok)}
.bn.ch.now .dm-edge{background:var(--warn)}
.bn.ch.fail .dm-edge{background:var(--bad)}
.bn.ch.sel{outline:none}
.bn.ch.sel .dm-edge{background:var(--ac)}
.bn.ch.sel .dm-fill{inset:3px}
.bn.done{border-color:var(--ok)}
.bn.done .bn-s{background:var(--ok-bg);color:var(--ok)}
.bn.now{border-color:var(--warn);border-width:2px}
.bn.now .bn-s{background:var(--warn-bg);color:var(--warn)}
.bn.now .bn-s i{animation:pulse 1.4s ease-in-out infinite}
.bn.fail{border-color:var(--bad);border-width:2px}
.bn.fail .bn-s{background:var(--bad-bg);color:var(--bad)}
.bn.halt{border-color:var(--off)}
.bn.halt .bn-s{background:var(--off-bg);color:var(--off)}
.bn.ch.halt .dm-edge{background:var(--off)}
.bn.skip{opacity:.4;cursor:not-allowed;box-shadow:none}
.bn.skip .bn-s{background:var(--off-bg);color:var(--off)}
.bn.sel{outline:2px solid var(--ac);outline-offset:2px;border-color:var(--ac)}
.dgcol{display:flex;flex-direction:column;align-items:center;transform-origin:top center;transition:transform .18s}
.node{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;padding:11px 17px;min-width:200px;justify-content:center;color:var(--ink);border-radius:var(--r);box-shadow:var(--sh)}
.node:hover{border-color:var(--ac)}
.node i{font-style:normal;font-weight:700;font-size:10.5px;font-family:ui-monospace,Consolas,monospace}
.node.done{border-color:transparent;background:var(--ok-bg);color:var(--ok);font-weight:600}
.node.now{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);font-weight:600}
.node.fail{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:600}
.node.skip{opacity:.42;cursor:not-allowed;box-shadow:none}
.node.gate{border-radius:999px}
.node.sel{outline:2px solid var(--ac);outline-offset:2px;border-color:var(--ac)}
.conn{width:2px;height:20px;background:var(--line-2);border-radius:2px}
.conn.dim{opacity:.3}
.conn.taken{background:var(--ok)}
.branch{display:flex;gap:30px;align-items:flex-start}
.branch>div{display:flex;flex-direction:column;align-items:center}
.blab{font-size:11px;color:var(--ink-3);margin-bottom:7px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.props{width:278px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column}
.propsh{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--raised)}
.propsh .lab{font-weight:600;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.propsh button{margin-left:auto;border:0;background:none;color:var(--ink-3);padding:2px 5px;border-radius:var(--r-sm);font-size:15px;line-height:1}
.propsh button:hover{background:var(--surface);color:var(--ink)}
.propsb{padding:15px 15px 18px;overflow:auto}
.propsb h4{margin:0 0 4px;font-size:15px;font-weight:600}
.pr{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--line)}
.pr span:first-child{color:var(--ink-3)}
.pbtn{width:100%;justify-content:center;margin-top:12px}
.exp{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--raised);font-size:12.5px;padding:9px 11px;margin-top:9px;width:100%;text-align:left;border-radius:var(--r)}
.exp:hover{border-color:var(--ac)}
.expbody{border:1px solid var(--line);border-radius:var(--r);background:var(--raised);padding:11px;margin-top:7px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink-2);white-space:pre-wrap}
.emptyprops{padding:30px 16px;text-align:center;color:var(--ink-3);font-size:12.5px}
/* misc */
.note{border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:var(--r);background:var(--ac-50);font-size:12.5px;color:var(--ink-2);padding:13px 15px;margin:14px 0}
.note.bad{border-left-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--raised);text-align:center;padding:44px 20px;color:var(--ink-3);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.sect{font-weight:600;font-size:16px;margin:22px 0 10px;letter-spacing:-.015em}
/* sign in */
.login{flex:1;display:grid;place-items:center;padding:60px 20px}
.loginbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:38px 36px}

/* A run walks the workflow AND, inside the graph-invocation step, the graph. The two are
   recorded separately, so drawing one model against the other's path would mark every node
   "not executed". This projects the run onto whichever model is being drawn. */
var DAG_ORDER = ['load','split','bureau','internal','device','join','score','thin','band'];

function graphRunFor(r){
  // Progress through the graph follows the invoking step's own progress.
  var invoked = r.path.indexOf('graph') > -1, atInvoke = r.at === 'graph';
  var path, at, st;
  if (r.state === 'failed' && atInvoke) {
    // the recorded failure is the bureau call timing out
    // A parallel split dispatches all three branches, so the siblings ran even though the
    // bureau call timed out. The gateway itself must be executed for any branch to have run.
    path = ['load','split','internal','device']; at = 'bureau'; st = 'failed';
  } else if (invoked) {
    path = DAG_ORDER.slice(); at = null; st = 'done';
  } else if (atInvoke) {
    path = ['load','split','bureau','internal']; at = 'device';
    st = r.state === 'stopped' ? 'stopped' : 'running';
  } else {
    path = []; at = null; st = 'running';       // the step has not been reached yet
  }
  var times = {};
  path.concat(at ? [at] : []).forEach(function(id, i){
    times[id] = { started:clockLabel((path.length + 1 - i) * 2), dur: (id === at && st !== 'done') ? null : (0.02 + Math.random() * 0.18).toFixed(2) + 's' };
  });
  return { wfId:r.wfId, state:st, path:path, at:at, times:times, why:r.why, graph:true, started:r.started, id:r.id, wf:r.wf };
}

function runFor(r, m){
  if (!r || r.state === 'view') return r;
  return (m === DAG) ? graphRunFor(r) : r;

var VIEWS;
/* Rebuilding the tree destroys whatever had focus, so the caret is captured before and

/* Rebuilding the tree recreates every scroll container at position 0, and the live
   tickers re-render every few seconds — so scroll offsets are captured and restored. */
var SCROLLERS = ['.main', '.cvstage', '.scroller', '.nav', '.fullstage', '.propsb'];
function captureScroll(){
  var out = {};
  SCROLLERS.forEach(function(sel){
    var n = document.querySelector(sel);
    if (n && (n.scrollTop || n.scrollLeft)) out[sel] = { top:n.scrollTop, left:n.scrollLeft, height:n.scrollHeight };
  });
  return out;
}
function restoreScroll(map){
  if (!map) return;

    var n = document.querySelector(sel);

    // New executions arrive at the top, so the content above the reader grows. Shifting
    // scrollTop by that growth keeps what they were looking at exactly where it was.
    var grew = n.scrollHeight - v.height;
    n.scrollTop = v.top + (v.top > 0 && grew > 0 ? grew : 0);
    n.scrollLeft = v.left;
  });
}

function captureFocus(){
  var a = document.activeElement;

}
function restoreFocus(f){

    if (by === 'success') return (a.success == null ? 999 : a.success) - (b.success == null ? 999 : b.success);
    if (by === 'status') return (a.live === b.live) ? a.w.name.localeCompare(b.w.name) : (a.live ? -1 : 1);

/* ---------- canvas ---------- */
function canvasArea(r0, w){
  var m = model();
  var r = runFor(r0, m);
  var isRun = r && r.state !== 'view';
  var notWalked = !!(r0 && r0.state !== 'view' && state.graphOpen);
  return el('div', { class:'cvwrap' }, [
    el('div', { class:'cv' }, [
      el('div', { class:'cvbar' }, [
        state.graphOpen
          ? el('button', { class:'btn sm', onclick:function(){ state.graphOpen = null; state.step = null; state.fitInline = true; render(); }, text:'←  Back to workflow view' })
          : el('span', { class:'lab', text:'Workflow canvas' }),
        state.graphOpen ? el('span', { class:'lab', text:'Graph · ' + graphName() }) : null,
        el('div', { class:'r' }, [
          el('div', { class:'seg' }, [
            el('button', { onclick:function(){ state.zoom = Math.max(0.5, state.zoom - 0.15); render(); }, text:'−' }),
            el('button', { onclick:function(){ state.zoom = Math.min(1.5, state.zoom + 0.15); render(); }, text:'+' }),
            el('button', { onclick:function(){ state.zoom = fitZoom('.cvstage', model()); render(); }, text:'Fit' }),
            el('button', { onclick:function(){ state.zoom = 1; render(); }, text:'100%' })
          ]),
          ((!r0 || r0.state === 'view') && state.graphOpen && has('authoring'))
            ? el('button', { class:'btn sm', onclick:function(){ toast('Wireframe: validation would list any problems in this graph'); }, text:'Validate' }) : null,
          el('button', { class:'btn sm', title:'Full screen (Esc to exit)', onclick:function(){ state.full = true; state.fullRun = r || null; state.fitOnOpen = true; render(); } }, [ el('span', { html:icon('full', 14) }) ]),
          el('span', { class:'z', text:Math.round(state.zoom * 100) + '%' })
        ])
      ]),
      notWalked ? el('div', { class:'note', style:'margin:13px 15px 0', text: (function(){
        var skipped = Object.keys(m.nodes).filter(function(id){ return nodeState(r, id) === 'waiting'; }).length;
        return skipped
          ? 'The route this run took through the graph, drawn against the whole graph. ' + skipped + (skipped === 1 ? ' step it did not reach is faded.' : ' steps it did not reach are faded.')
          : 'The route this run took through the graph. This run reached every step in the graph.';
      })() }) : null,
      el('div', { class:'cvstage', onclick:function(e){ if (e.target.classList.contains('cvstage') || e.target.classList.contains('stageinner')) { state.step = null; render(); } } },
        [ stage(r, m) ])
    ]),

      state.step ? propsBody(r, m) : el('div', { class:'emptyprops', text: isRun ? 'Select a node in the canvas to see what happened at that step.' : 'Select a node in the canvas to inspect its properties.' })
    ])
  ]);
}

/* An absolutely-positioned stage: SVG edges underneath, node cards on top. */
function stage(r, m){
  // A transform does not change layout size, so the scaled drawing is wrapped in a sizer
  // whose box IS the scaled size — otherwise the scroll extent never matches the zoom.
  var sizer = el('div', { class:'stagesizer', style:'position:relative;width:' + Math.ceil(m.w * state.zoom) + 'px;height:' + Math.ceil(m.h * state.zoom) + 'px' });
  var inner = el('div', { class:'stageinner', style:'position:absolute;left:0;top:0;width:' + m.w + 'px;height:' + m.h + 'px;transform:scale(' + state.zoom + ');transform-origin:top left' });
  var ns = m.nodes;
  function box(id){
    var n = ns[id], isEvent = n.type === 'start' || n.type === 'end';
    var gate = n.type === 'choice' || n.type === 'parallel' || n.type === 'join';
    return { x:n.x, y:n.y, w:isEvent ? 108 : (gate ? 200 : 216), h:isEvent ? 44 : (gate ? 120 : 66) };
  }
  var svg = '<svg width="' + m.w + '" height="' + m.h + '" style="position:absolute;inset:0;pointer-events:none" fill="none">';
  m.edges.forEach(function(e){
    var a = box(e[0]), b = box(e[1]);
    var x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y;
    var taken = r && r.state !== 'view' && reached(r, e[0]) && reached(r, e[1]);
    var col = taken ? 'var(--ok)' : 'var(--line-2)';
    var op = (r && r.state !== 'view' && !taken) ? '0.35' : '1';
    var mid = y1 + (y2 - y1) / 2;
    var d = Math.abs(x1 - x2) < 3
      ? 'M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2
      : 'M' + x1 + ' ' + y1 + ' L' + x1 + ' ' + mid + ' L' + x2 + ' ' + mid + ' L' + x2 + ' ' + y2;
    svg += '<path d="' + d + '" stroke="' + col + '" stroke-width="2" opacity="' + op + '" stroke-linejoin="round"/>';
    svg += '<path d="M' + (x2 - 5) + ' ' + (y2 - 7) + ' L' + x2 + ' ' + y2 + ' L' + (x2 + 5) + ' ' + (y2 - 7) + '" stroke="' + col + '" stroke-width="2" opacity="' + op + '" stroke-linejoin="round"/>';
    if (e[2]) svg += '<text x="' + (x1 + (x2 - x1) / 2) + '" y="' + (mid - 7) + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink-3)" font-family="system-ui,sans-serif">' + e[2] + '</text>';
  });
  svg += '</svg>';
  inner.appendChild(el('div', { html:svg, style:'position:absolute;inset:0' }));
  Object.keys(ns).forEach(function(id){ inner.appendChild(nodeEl(r, id, ns[id])); });
  sizer.appendChild(inner);
  return sizer;
}

/* Compute a zoom that actually fits the model inside its scroll container. */
function fitZoom(selector, m){
  var box = document.querySelector(selector);
  if (!box) return 0.8;
  var pad = 56;
  var z = Math.min((box.clientHeight - pad) / m.h, (box.clientWidth - pad) / m.w);
  return Math.max(0.3, Math.min(1.5, Math.round(z * 100) / 100));
}

function reached(r, id){ return !!r && (r.path.indexOf(id) > -1 || r.at === id); }

/* A node's state depends on the RUN's state, not only on where the run stopped.
   Every consumer — canvas node, step strip, properties panel, input/output — uses this. */
function nodeState(r, id){
  if (!r || r.state === 'view') return null;
  if (r.at === id) {
    if (r.state === 'failed')  return 'failed';
    if (r.state === 'stopped') return 'halted';
    if (r.state === 'running') return 'running';
    return 'done';                       // run finished on this node
  }
  return r.path.indexOf(id) > -1 ? 'done' : 'waiting';
}
var NODE_STATE = {
  done:    { cls:'done', sym:'✓', label:'Success' },
  running: { cls:'now',  sym:'◐', label:'Running' },
  halted:  { cls:'halt', sym:'□', label:'Halted' },
  failed:  { cls:'fail', sym:'✕', label:'Failed' },
  waiting: { cls:'skip', sym:'○', label:'Not executed' }
};

function nodeEl(r, id, n){
  // Two views share this renderer: a RUN view, where a node's appearance reflects what
  // happened, and a DEFINITION view, where nothing has run and every node is readable.
  var view = !r || r.state === 'view';
  var isEvent = n.type === 'start' || n.type === 'end';
  var isGate = n.type === 'choice' || n.type === 'parallel' || n.type === 'join';
  var cls = 'bn' + (isEvent ? ' ev' : '') + (isGate ? ' ch' : '');
  var sym = null, statusLabel = null;
  if (!view) {
    var ns2 = NODE_STATE[nodeState(r, id)] || NODE_STATE.waiting;
    cls += ' ' + ns2.cls; sym = ns2.sym; statusLabel = ns2.label;
  }
  if (state.step === id) cls += ' sel';
  var clickable = view || reached(r, id);
  var kids;
  if (isGate) {
    // Gateways are drawn as diamonds. Two clipped layers make the outline; the label is a
    // separate centred element so it is not clipped. A parallel gateway carries a "+".
    var glyph = n.type === 'choice' ? '×' : '+';
    kids = [ el('span', { class:'dm-edge' }), el('span', { class:'dm-fill' }),
      el('span', { class:'dm-lab' }, [
        el('span', { class:'dm-g', text:glyph }),
        el('span', { class:'dm-n', text:n.name }),
        statusLabel ? el('span', { class:'bn-s' }, [ el('i', { text:sym }), statusLabel ]) : null ]) ];
  } else if (isEvent) {
    kids = [ el('span', { class:'bn-ev', text:n.name }) ];
  } else {
    kids = [ el('span', { class:'bn-t', text:NODE_TYPES[n.type] || n.type }),
      el('span', { class:'bn-n', text:n.name }),
      statusLabel ? el('span', { class:'bn-s' }, [ el('i', { text:sym }), statusLabel ]) : null ];
  }
  return el('button', { class:cls, style:'position:absolute;left:' + n.x + 'px;top:' + n.y + 'px',
    title: clickable ? 'Inspect this node' : 'This node was not executed in this run',
    onclick: clickable ? function(e){ e.stopPropagation(); state.step = id; state.expanded = {}; render(); } : null }, kids);
}

function nodeLabel(idOrWf, maybeId){
  var id = maybeId === undefined ? idOrWf : maybeId;
  var n = BPMN.nodes[id] || DAG.nodes[id];
  return n ? n.name : '—';
}

/* Input and output, loaded only when opened. */
/* On a run, an output only exists if the step completed. A failed or still-running step
   has no output, and showing the authored happy-path payload would contradict its status. */
function showIO(kids, io, prefix, outcome){
  var isRun = !!outcome;
  var outBody = io && io.out, outNote = null;
  if (outcome === 'failed')  { outBody = null; outNote = 'No output — the step did not complete.'; }
  if (outcome === 'running') { outBody = null; outNote = 'Not yet available — the step is still running.'; }
  if (outcome === 'halted')  { outBody = null; outNote = 'No output — the run was stopped at this step.'; }
  if (outcome === 'waiting') { outBody = null; outNote = 'No output — this step was not reached in this run.'; }
  [[isRun ? 'What went in' : 'What goes in', io && io.in, null],
   [isRun ? 'What came out' : 'What comes out', outBody, outNote]].forEach(function(pair, i){
    var key = prefix + i;
    kids.push(el('button', { class:'exp', onclick:function(){ state.expanded[key] = !state.expanded[key]; render(); },
      text:(state.expanded[key] ? '▾  ' : '▸  ') + pair[0] }));
    if (!state.expanded[key]) return;
    if (pair[2]) kids.push(el('div', { class:'note', style:'margin:7px 0 0', text:pair[2] }));
    else kids.push(el('div', { class:'expbody', text: pair[1] || '{\n  "placeholder": "shape not defined yet"\n}' }));
  });
}

function propsBody(r, m){
  var isRun = r && r.state !== 'view';
  var n = m.nodes[state.step] || BPMN.nodes[state.step];
  if (!n) return el('div', { class:'emptyprops', text:'This node is not part of the current view.' });
  var nstate = isRun ? nodeState(r, state.step) : null;
  var failed = nstate === 'failed';
  var actions = [];
  var kids = [
    el('div', { class:'bn-t', style:'color:var(--ink-3)', text:NODE_TYPES[n.type] || n.type }),
    el('h4', { text:n.name })
  ];
  if (isRun) kids.push(el('div', { style:'margin:10px 0 6px' }, [
    status({ done:'done', running:'running', halted:'stopped', failed:'failed', waiting:'waiting' }[nstate] || 'waiting') ]));
  (n.rows || []).forEach(function(row){
    kids.push(el('div', { class:'pr' }, [ el('span', { text:row[0] }),
      el('span', { class: row[2] ? 'mono' : '', text:row[1] }) ]));
  });
  if (isRun) {
    var t = (r.times && r.times[state.step]) || null;
    kids.push(el('div', { class:'pr' }, [ el('span', { text:'Started' }),
      el('span', { class:'mono', text: t ? t.started : '—' }) ]));
    kids.push(el('div', { class:'pr' }, [ el('span', { text:'Time taken' }),
      el('span', { class:'mono', text: (t && t.dur) ? t.dur : (nstate === 'running' ? 'still running' : '—') }) ]));
    if (failed) kids.push(el('div', { class:'note bad', text:r.why }));
  if (nstate === 'halted') kids.push(el('div', { class:'note', style:'border-left-color:var(--off);background:var(--off-bg);color:var(--ink-2)',
    text:'The run was stopped while this step was in progress, so it did not finish. Nothing after it was reached.' }));
  } else {
    if (n.type === 'choice') {
      kids.push(el('div', { class:'menu-h', style:'margin:16px 0 7px', text:'The rule, in plain words' }));
      kids.push(el('div', { class:'note', style:'margin:0', text:'If the risk score reaches 70 or above, send for manual review. Otherwise approve automatically.' }));
    }

    if (has('authoring')) actions.push(el('button', { class:'btn pri pbtn', onclick:function(){ toast('Wireframe: the node editor would open'); }, text:'Edit this node' }));
  }
  // Every node declares what goes in and what comes out. Loaded only when opened.
  var outcome = isRun ? nstate : null;
  // A graph node can be opened from a definition AND from a run.
  if (n.type === 'graph') actions.unshift(el('button', { class:'btn pri pbtn', onclick:function(){
    state.graphOpen = state.step; state.step = null; state.fitInline = true; render();
  }, text:'Show graph view  →' }));

  showIO(kids, n.io, 'io-' + state.step + '-', outcome);
  // Actions come last, after everything the reader needs in order to act.
  actions.forEach(function(a){ kids.push(a); });
  return el('div', { class:'propsb' }, kids);
}

/* ---------- executions ---------- */
function runsScreen(){
  var f = state.filter;
  var rows = RUNS.filter(function(r){
    return f === 'all' || (f === 'running' && r.state === 'running') || (f === 'failed' && r.state === 'failed') ||
           (f === 'done' && r.state === 'done') || (f === 'stopped' && r.state === 'stopped');
  });
  var ranges = [['today','Today'],['7d','Last 7 days'],['30d','Last 30 days']];
  var filters = [['all','All'],['done','Success'],['failed','Failed'],['stopped','Halted'],['running','Running']];
  return el('div', {}, [
    el('div', { class:'head' }, [ el('div', {}, [
      el('div', { class:'h1', text:'Executions' }),
      el('div', { class:'sub', text:'Most recent first · new runs appear on their own · only the rows on screen are drawn' })
    ]) ]),
    el('div', { class:'cards' }, [
      card('Running now', String(M.running), [deltaTrend(DELTA.running, '', true), 'since last check'], 'running'),
      card('Executions · 7d', fmt(M.executions), [deltaTrend(DELTA.executions, '%', true), 'vs last week'], 'executions'),
      card('Failed today', String(M.failedToday), [deltaTrend(DELTA.failedToday, '', false), 'vs yesterday'], 'failedToday'),
      card('Avg duration · 7d', M.avg, [deltaTrend(DELTA.avgMs, 'ms', false), 'vs last week'])
    ]),
    el('div', { class:'filters' }, [
      el('div', { class:'finput' }, [ el('span', { html:icon('search', 15) }), 'Search execution, workflow or transaction…' ]),
      el('div', { class:'seg' }, ranges.map(function(x){
        return el('button', { class: state.range === x[0] ? 'on' : '', onclick:function(){ state.range = x[0]; render(); }, text:x[1] });
      }))
    ]),
    el('div', { class:'filters' }, [
      el('div', { class:'chips' }, filters.map(function(x){
        return el('button', { class:'chip' + (state.filter === x[0] ? ' on' : ''), onclick:function(){ state.filter = x[0]; render(); }, text:x[1] });
      })),
      state.filter !== 'all' ? el('button', { class:'btn quiet sm', onclick:function(){ state.filter = 'all'; render(); }, text:'Clear' }) : null,
      el('span', { style:'margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;gap:7px;align-items:center' },
        [ rows.length + ' shown', el('span', { class:'livedot' }, [ el('i', {}), 'live' ]) ])
    ]),
    arrived ? el('button', { class:'newpill', onclick:function(){
      arrived = 0;
      var sc = document.querySelector('.scroller'); if (sc) sc.scrollTop = 0;
      var mn = document.querySelector('.main'); if (mn) mn.scrollTop = 0;
      render();
    }, text:'↑  ' + arrived + (arrived === 1 ? ' new execution' : ' new executions') + ' — jump to top' }) : null,
    rows.length ? el('div', { class:'pan' }, [ el('div', { class:'scroller' }, [ el('table', {}, [
      el('thead', {}, [ el('tr', {}, [
        el('th', { text:'Execution' }), el('th', { text:'Workflow' }), el('th', { text:'Status' }),
        el('th', { text:'Current step' }), el('th', { class:'right', text:'Duration' }), el('th', { class:'right', text:'Started' })
      ]) ]),
      el('tbody', {}, rows.map(function(r){
        return el('tr', { class: r.fresh ? 'new' : '', onclick:function(){ go('run', r.id); } }, [
          el('td', { class:'mono', text:r.id }),
          el('td', { style:'font-weight:500', text:r.wf }),
          el('td', {}, [ status(r.state) ]),
          el('td', { style:'color:var(--ink-3);font-size:12.5px', text: r.at ? nodeLabel(r.wfId, r.at) : '—' }),
          el('td', { class:'right mono', text:r.dur || '—' }),
          el('td', { class:'right', style:'color:var(--ink-3)', text:r.started })
        ]);
      }))
    ]) ]) ]) : el('div', { class:'empty' }, [ el('b', { text:'No executions match these filters' }),
      el('div', { text:'Widen the date range or clear the status filter.' }) ])
  ]);
}

function runScreen(){
  var r = tenantRuns().filter(function(x){ return x.id === state.id; })[0];
  if (!r) return el('div', { class:'empty' }, [ el('b', { text:'This execution is no longer listed' }),
    el('div', { text:'The wireframe keeps a limited history — go back to Executions.' }) ]);
  var kids = [
    el('div', { class:'crumb' }, [
      el('button', { onclick:function(){ go('runs'); }, text:'Executions' }), el('span', { text:'/' }),
      state.graphOpen
        ? el('button', { onclick:function(){ state.graphOpen = null; state.step = null; state.fitInline = true; render(); }, text:r.id })
        : el('span', { text:r.id }),
      state.graphOpen ? el('span', { text:'/' }) : null,
      state.graphOpen ? el('span', { text:graphName() }) : null
    ]),
    el('div', { class:'head' }, [
      el('div', {}, [ el('div', { class:'h1', text:r.wf }),
        el('div', { class:'sub', text:'Execution ' + r.id + ' · started ' + r.started + (r.dur ? ' · took ' + r.dur : '') }) ]),
      el('div', { class:'acts' }, [
        status(r.state),
        r.state === 'running' ? el('button', { class:'btn', onclick:function(){ r.state = 'stopped'; r.dur = null; toast('Execution halted'); }, text:'Stop this run' }) : null,
        el('button', { class:'btn', text:'Export' })
      ])
    ])
  ];
  if (r.state === 'failed' && r.why) kids.push(el('div', { class:'note bad' }, [ el('b', { text:'Why it failed — ' }), r.why ]));
  if (r.state === 'running') kids.push(el('div', { class:'note warn', text:'This execution is in progress. The steps below advance on their own.' }));
  kids.push(stepStrip(state.graphOpen ? runFor(r, DAG) : r, state.graphOpen ? DAG : BPMN));
  kids.push(el('div', { class:'tabs' }, [['diagram','Execution trace'],['history','History']].map(function(t){
    return el('button', { class:'tab' + (state.tab === t[0] ? ' on' : ''), onclick:function(){ state.tab = t[0]; render(); }, text:t[1] });
  })));
  kids.push(state.tab === 'history' ? historyTable(r) : canvasArea(r));
  return el('div', {}, kids);
}
function stepStrip(r, m){
  var out = [], nodes = flatNodes(r.wfId, r, m || BPMN);
  nodes.forEach(function(n, i){
    var st = NODE_STATE[nodeState(r, n.id)] || NODE_STATE.waiting;
    var cls = 'step ' + st.cls, sym = st.sym;
    out.push(el('span', { class:cls }, [ el('i', { text:sym }), n.label ]));
    if (i < nodes.length - 1) out.push(el('span', { class:'sep', text:'›' }));
  });
  return el('div', { class:'steps' }, out);
}
function flatNodes(wfId, r, m){
  m = m || BPMN;
  var out = [];
  m.seq.forEach(function(id){
    var alts = null;
    Object.keys(m.branches || {}).forEach(function(g){ if (m.branches[g].indexOf(id) > -1) alts = m.branches[g]; });
    if (!alts) { out.push({ id:id, label:m.nodes[id].name }); return; }
    var taken = alts.filter(function(a){ return r && (r.path.indexOf(a) > -1 || r.at === a); });
    (taken.length ? taken : [id]).forEach(function(a){ out.push({ id:a, label:m.nodes[a].name }); });
  });
  return out;
}

function historyTable(r){
  var ids = r.path.concat(r.at ? [r.at] : []);
  return el('div', { class:'pan' }, [ el('table', {}, [
    el('thead', {}, [ el('tr', {}, [ el('th', { text:'Time' }), el('th', { text:'What happened' }), el('th', { text:'Step' }) ]) ]),
    el('tbody', {}, ids.map(function(id, i){
      return el('tr', {}, [ el('td', { class:'mono', text:r.started }),
        el('td', { text: i === 0 ? 'Started by the platform' : 'Step completed' }),
        el('td', { text:nodeLabel(r.wfId, id) }) ]);
    }))
  ]) ]);
}

    ]),
    el('div', { class:'sect', text:'Your notes' }),
    el('textarea', { class:'ta', placeholder:'A reason is required if you reject.', oninput:function(e){ state.taskNote = e.target.value; } }),
    el('div', { style:'display:flex;justify-content:flex-end;gap:9px;margin-top:16px' }, [

        if (!state.taskNote) { toast('Rejecting requires a reason — add a note first'); return; }

VIEWS = { home:homeScreen, runs:runsScreen, run:runScreen, workflows:workflowsScreen, workflow:workflowScreen,
